name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: npm ci
      - run: just --fmt --check
      - run: just reviewer -- help
      - run: npm run check
      - run: npm test
      - run: npm run test:just
      - run: npm audit --omit=dev --audit-level=high

  compatibility:
    name: Compatibility (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Node 22 minimum
            os: ubuntu-latest
            node: 22
          - label: Node 26 current
            os: ubuntu-latest
            node: 26
          - label: Windows
            os: windows-latest
            node: 24
          - label: macOS
            os: macos-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: npm ci
      - run: npm test
      - run: npm run test:just
      - run: just reviewer -- help
      - name: Validate Bash entrypoint
        if: runner.os != 'Windows'
        run: ./scripts/shell/reviewer.sh help
      - name: Validate PowerShell entrypoint
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = @()
          Get-ChildItem .\scripts\powershell\*.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            $errors += $parseErrors
          }
          if ($errors.Count) { throw ($errors | Out-String) }
          .\scripts\powershell\reviewer.ps1 help

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: critical

  release:
    name: Semantic release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [quality, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create release App token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Configure Git authentication
        run: gh auth setup-git
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
      - run: npm run release
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
